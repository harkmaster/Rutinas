<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#152027">
<title>Protocolo diario de suplementación – Agustín</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#152027; --surface:#1C2A32; --surface-2:#22333C; --line:#2E424C;
    --text:#ECE7DE; --muted:#9CA9AF;
    --a:#C9485B; --b:#5B8DC4; --c:#82AE8F; --warn:#DDAA4A;
    --accent:var(--a);
    --serif:"Instrument Serif", Georgia, "Times New Roman", serif;
    --sans:"Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); font-size:16px; line-height:1.55;
    -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%; text-size-adjust:100%;
    overflow-wrap:anywhere;
    background-image:radial-gradient(1200px 500px at 85% -10%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%);
    transition:background-image .4s;
  }
  .wrap{max-width:760px; margin:0 auto; padding:48px 20px 64px}

  header h1{
    font-family:var(--serif); font-weight:400; font-size:clamp(2.6rem,7vw,4.2rem);
