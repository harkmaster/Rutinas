    </dl>
  </aside>
</main>

<script>
  const tabs=[...document.querySelectorAll('.tab')];
  const colors={a:'--a',b:'--b',c:'--c'};
  function select(tab){
    tabs.forEach(t=>{
      const on=t===tab;
      t.setAttribute('aria-selected',on);
      t.tabIndex=on?0:-1;
      document.getElementById(t.getAttribute('aria-controls')).hidden=!on;
    });
    document.documentElement.style.setProperty('--accent',`var(${colors[tab.dataset.p]})`);
    try{localStorage.setItem('protocolo',tab.dataset.p)}catch(e){}
  }
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>{select(t); const tb=document.querySelector('.tabs'); if(tb.getBoundingClientRect().top<=1) window.scrollTo({top:tb.offsetTop-8,behavior:'smooth'});});
    t.addEventListener('keydown',e=>{
      if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;
      const n=tabs[(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length];
      n.focus(); select(n);
    });
  });
  try{const g=localStorage.getItem('protocolo'); const t=tabs.find(x=>x.dataset.p===g); if(t) select(t);}catch(e){}
</script>
</body>
</html>
